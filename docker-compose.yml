services:
  stackspace:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: sqlite:////app/data/stackspace.db
    volumes:
      - launchlens_data:/app/data
    restart: unless-stopped
volumes:
  launchlens_data:
